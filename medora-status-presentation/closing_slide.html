<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>MEDORA: The Future of Health Care</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: linear-gradient(135deg, #001F3F 0%, #003366 50%, #00509E 100%);
            color: #FFFFFF;
            font-family: 'Inter', 'Cairo', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .bg-pattern {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.05;
            background-image: radial-gradient(#FFFFFF 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }
        .content-wrapper {
            z-index: 2;
            text-align: center;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-icon {
            font-size: 72px;
            color: #00A3E0;
            margin-bottom: 40px;
        }
        h1 {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: #FFFFFF;
        }
        .arabic-title {
            font-family: 'Cairo', sans-serif;
            font-size: 56px;
            font-weight: 800;
            margin-bottom: 40px;
            color: #E6F2FF;
        }
        .divider {
            width: 120px;
            height: 4px;
            background: #00A3E0;
            margin-bottom: 40px;
        }
        .thank-you {
            font-size: 28px;
            font-weight: 400;
            color: #B3D4FF;
            margin-bottom: 10px;
        }
        .thank-you-ar {
            font-family: 'Cairo', sans-serif;
            font-size: 28px;
            font-weight: 400;
            color: #B3D4FF;
            margin-bottom: 60px;
        }
        .contact-info {
            display: flex;
            gap: 50px;
            font-size: 20px;
            color: #FFFFFF;
            background: rgba(0, 51, 102, 0.5);
            padding: 20px 40px 0 40px;
            min-height: 70px;
            border: 1px solid #00A3E0;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .contact-item i {
            color: #00A3E0;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="bg-pattern"></div>
        <div class="content-wrapper">
            <i class="fas fa-globe-americas logo-icon"></i>
            
            <h1>MEDORA: The Future of Health Care</h1>
            <div class="arabic-title">ميدورا: مستقبل الرعاية الصحية</div>
            
            <div class="divider"></div>
            
            <div class="thank-you">Thank you for your partnership and trust.</div>
            <div class="thank-you-ar">شكراً لثقتكم وشراكتكم.</div>
            
            <div class="contact-info">
                <div class="contact-item">
                    <i class="fas fa-link"></i>
                    <span>www.medora.health</span>
                </div>
                <div class="contact-item">
                    <i class="fas fa-envelope"></i>
                    <span>partners@medora.health</span>
                </div>
                <div class="contact-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>Global HQ</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
