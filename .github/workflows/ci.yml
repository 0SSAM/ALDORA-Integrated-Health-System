name: ALDORA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aldora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, tests, build, and smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start isolated test server
        run: |
          NODE_ENV=development \
          PORT=3000 \
          JWT_SECRET="ci-only-jwt-secret-not-for-production" \
          DATABASE_URL="mysql://ci:ci@127.0.0.1:3306/aldora_ci" \
          AUDIT_SIGNING_KEY="ci-only-audit-signing-key-not-for-production-2026" \
          SHOWCASE_TEST_PASSWORD="CI-only-showcase-password-2026" \
          VITE_APP_ID="ci-smoke" \
          OAUTH_SERVER_URL="http://127.0.0.1:3999" \
          OWNER_OPEN_ID="ci-smoke" \
          OWNER_NAME="ALDORA CI" \
          BUILT_IN_FORGE_API_URL="https://ci.invalid" \
          BUILT_IN_FORGE_API_KEY="ci-only-disabled" \
          pnpm dev > /tmp/aldora-ci-server.log 2>&1 &
          echo $! > /tmp/aldora-ci-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aldora-ci-server.log
          exit 1

      - name: TypeScript check
        run: pnpm check

      - name: Workflow format check
        run: pnpm exec prettier --check .github/workflows

      - name: Smoke script syntax check
        run: bash -n scripts/ci-smoke.sh

      - name: Unit and contract tests
        run: pnpm test

      - name: Stop isolated test server
        if: always()
        run: |
          if [[ -f /tmp/aldora-ci-server.pid ]]; then
            kill "$(cat /tmp/aldora-ci-server.pid)" 2>/dev/null || true
          fi
          if [[ -f /tmp/aldora-ci-server.log ]]; then
            tail -n 80 /tmp/aldora-ci-server.log || true
          fi

      - name: Dependency security audit
        run: pnpm audit --prod --audit-level=high

      - name: Production build
        run: pnpm build

      - name: Post-build smoke check
        run: ./scripts/ci-smoke.sh

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for CodeQL
        run: pnpm build

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Dependency review (advisory)
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
