<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box} body{margin:0;padding:0} .slide-container{width:1280px;min-height:720px;background:#f7f9f7;position:relative;overflow:hidden;font-family:Arial,sans-serif;color:#1a4331}.left{position:absolute;left:0;top:0;width:820px;min-height:720px;background:#102f2a;padding:68px 64px}.eyebrow{font:500 15px monospace;color:#9fd8c4;letter-spacing:2px;text-transform:uppercase}.rule{width:112px;height:1px;background:#e07a5f;margin-top:22px}.title{font-size:72px;line-height:1;letter-spacing:-2px;font-weight:700;margin-top:58px;color:#fff}.arabic{font-size:31px;line-height:1.25;font-weight:600;color:#bfe7d6;margin-top:22px;direction:rtl;text-align:left}.thesis{font-size:22px;line-height:1.45;color:#e6f2ed;margin-top:60px;max-width:560px}.thesis span{color:#f09a80}.right{position:absolute;right:0;top:0;width:460px;min-height:720px;background:#f7f9f7}.block-a{position:absolute;right:34px;top:74px;width:288px;height:288px;background:#1a4331;opacity:.95}.block-b{position:absolute;right:122px;top:164px;width:284px;height:284px;background:#4fae98;opacity:.46}.block-c{position:absolute;right:0;bottom:54px;width:220px;height:220px;background:#e07a5f;opacity:.72}.marker{position:absolute;right:58px;bottom:76px;font:500 118px monospace;color:#1a4331;opacity:.9}.side-label{position:absolute;right:66px;top:30px;font:500 13px monospace;color:#475569;letter-spacing:1px;writing-mode:vertical-rl}.footer{position:absolute;left:74px;bottom:32px;font:500 13px monospace;color:#9fd8c4;letter-spacing:1px}

</head>
<body>
<div class="slide-container">

    <div class="arabic">ميدورا — منظومة الرعاية الصحية المتكاملة</div>
    <div class="thesis">A trusted operating layer for healthcare organizations that need <span>visibility, control, and scalable execution.</span></div>
    <div class="footer">PHARMACY • HOSPITAL • HEALTHCARE NETWORKS</div>
  </div>
  <div class="right">
    <div class="side-label">HEALTHCARE OPERATIONS, REIMAGINED</div>
    <div class="block-a"></div><div class="block-b"></div><div class="block-c"></div>
    <div class="marker">01</div>
  </div>
</div>

</html>
